{% if messages %}
<div class="container" style="padding-top: 1rem;">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}" role="alert">
    <span>{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
